# Standarddienst `kitb`: Daten, Backtests, Auswertungen – ohne Ports.
# `dashboard` (Profil "dashboard"): nur an 127.0.0.1 des Rechners gebunden, nicht aus dem Netzwerk erreichbar.
# Beispiele:
#   docker compose build
#   docker compose run --rm kitb check-safety
#   docker compose run --rm kitb download --exchange binance --timerange 20220101-
#   docker compose run --rm kitb backtest --source binance
#   docker compose run --rm --entrypoint pytest kitb -q
x-paper-fleet: &paper-fleet
  image: kitb:local
  profiles: ["paper-learn"]
  restart: on-failure
  volumes:
    - ./config:/kitb/config:ro
    - ./user_data:/kitb/user_data

services:
  kitb:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kitb:local
    volumes:
      - ./config:/kitb/config:ro
      - ./user_data:/kitb/user_data
      - ./tests:/kitb/tests:ro
      - ./pyproject.toml:/kitb/pyproject.toml:ro

  dashboard:
    image: kitb:local
    profiles: ["dashboard"]
    command: ["dashboard", "--address", "0.0.0.0"]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./config:/kitb/config:ro
      - ./user_data:/kitb/user_data

  # Paper-Trading (Profil "paper"): Freqtrade-Dry-Run, virtuelles Kapital, keine Ports, keine API-Keys.
  # Profil "paper-learn": dieselben KI-Bots im Lernmodus (ohne freigegebenes Modell, tägliches Neutraining;
  # Voraussetzung: kitb strategies approve --id fleet --by NAME --reason "...").
  # Start: docker compose --profile paper up -d   ·   Stopp: docker compose --profile paper stop
  # restart on-failure: nach Absturz automatischer Wiederanlauf (Zustand aus der Dry-Run-DB);
  # nach Not-Stopp (geordnetes Beenden) KEIN automatischer Neustart.
  paper-bot-a:
    image: kitb:local
    profiles: ["paper", "paper-learn"]
    command: ["paper", "run", "--bot", "bot_a"]
    restart: on-failure
    volumes:
      - ./config:/kitb/config:ro
      - ./user_data:/kitb/user_data

  paper-bot-b:
    image: kitb:local
    profiles: ["paper", "paper-learn"]
    command: ["paper", "run", "--bot", "bot_b"]
    restart: on-failure
    volumes:
      - ./config:/kitb/config:ro
      - ./user_data:/kitb/user_data

  # Regel-Strategie DailyTrendSma (Tageskerzen) – eigenes Profil, damit sie ohne KI-Bots startet.
  # Voraussetzung: kitb strategies approve --id trend_d1 --by NAME --reason "..."
  # Start: docker compose --profile paper-trend up -d   ·   Stopp: docker compose --profile paper-trend stop
  paper-trend-d1:
    image: kitb:local
    profiles: ["paper-trend"]
    command: ["paper", "run", "--bot", "trend_d1"]
    restart: on-failure
    volumes:
      - ./config:/kitb/config:ro
      - ./user_data:/kitb/user_data

  # Datensammler-Flotte (Profil "paper-learn", Freigabe Burak 22.10.2026): verschiedene Handelsarten im Dry-Run,
  # je 10.000 USDT virtuell. *_ki = gleiche Strategie mit KI-Filter, ohne Suffix = Kontrollgruppe ohne Filter.
  # Verlustlimit erreicht -> nur dieser Bot beginnt eine neue Runde mit frischem Kapital (alte Runde bleibt gespeichert).
  paper-ema-cross-1h:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "ema_cross_1h"]
  paper-trend-adx-1h:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "trend_adx_1h"]
  paper-macd-rsi-1h:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "macd_rsi_1h"]
  paper-bollinger-1h:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "bollinger_1h"]
  paper-donchian-1h:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "donchian_1h"]
  paper-squeeze-1h:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "squeeze_1h"]
  paper-momentum-d1:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "momentum_d1"]
  paper-ema-cross-1h-ki:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "ema_cross_1h_ki"]
  paper-trend-adx-1h-ki:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "trend_adx_1h_ki"]
  paper-macd-rsi-1h-ki:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "macd_rsi_1h_ki"]
  paper-bollinger-1h-ki:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "bollinger_1h_ki"]
  paper-donchian-1h-ki:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "donchian_1h_ki"]
  paper-squeeze-1h-ki:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "squeeze_1h_ki"]
  paper-momentum-d1-ki:
    <<: *paper-fleet
    command: ["paper", "run", "--bot", "momentum_d1_ki"]

  # KI-Gedächtnis: einmal täglich alle Trades sammeln, KI-Filter neu lernen und auf ungesehenen Trades prüfen.
  ai-memory:
    <<: *paper-fleet
    command: ["memory", "loop"]
    restart: unless-stopped
