# Standarddienst `kitb`: Daten, Backtests, Auswertungen – ohne Ports.
# `dashboard` (Profil "dashboard"): nur an 127.0.0.1 des Rechners gebunden, nicht aus dem Netzwerk erreichbar.
# Beispiele:
#   docker compose build
#   docker compose run --rm kitb check-safety
#   docker compose run --rm kitb download --exchange binance --timerange 20220101-
#   docker compose run --rm kitb backtest --source binance
#   docker compose run --rm --entrypoint pytest kitb -q
services:
  kitb:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kitb:local
    volumes:
      - ./config:/kitb/config:ro
      - ./user_data:/kitb/user_data
      - ./tests:/kitb/tests:ro
      - ./pyproject.toml:/kitb/pyproject.toml:ro

  dashboard:
    image: kitb:local
    profiles: ["dashboard"]
    command: ["dashboard", "--address", "0.0.0.0"]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./config:/kitb/config:ro
      - ./user_data:/kitb/user_data

  # Paper-Trading (Profil "paper"): Freqtrade-Dry-Run, virtuelles Kapital, keine Ports, keine API-Keys.
  # Start: docker compose --profile paper up -d   ·   Stopp: docker compose --profile paper stop
  # restart on-failure: nach Absturz automatischer Wiederanlauf (Zustand aus der Dry-Run-DB);
  # nach Not-Stopp (geordnetes Beenden) KEIN automatischer Neustart.
  paper-bot-a:
    image: kitb:local
    profiles: ["paper"]
    command: ["paper", "run", "--bot", "bot_a"]
    restart: on-failure
    volumes:
      - ./config:/kitb/config:ro
      - ./user_data:/kitb/user_data

  paper-bot-b:
    image: kitb:local
    profiles: ["paper"]
    command: ["paper", "run", "--bot", "bot_b"]
    restart: on-failure
    volumes:
      - ./config:/kitb/config:ro
      - ./user_data:/kitb/user_data
