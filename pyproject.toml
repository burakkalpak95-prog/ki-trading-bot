[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitb"
version = "0.1.0"
description = "KI-Trading-Bot – Phase 1: Daten, Validierung, Speicherung, Backtest-Baseline (auf Basis von Freqtrade)"
requires-python = ">=3.11"
# Freqtrade bringt pandas, numpy, ccxt, pyarrow, ta-lib, sqlalchemy mit.
# Version identisch zum Docker-Image freqtradeorg/freqtrade:2026.9 halten.
dependencies = [
    "freqtrade==2026.9",
    "ccxt==4.5.84",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# Entspricht requirements-freqai.txt von Freqtrade 2026.9 (im Docker-Image ...:2026.9_freqai enthalten)
ml = ["scikit-learn==1.9.1", "joblib==1.6.0", "cloudpickle==3.1.2", "lightgbm==4.7.0", "xgboost==3.2.0",
      "datasieve==0.1.9"]

[project.scripts]
kitb = "kitb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "network: braucht Internetzugang zu einer Börse (standardmäßig übersprungen)",
]
addopts = "-m 'not network'"
